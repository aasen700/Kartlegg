name: Kartlegg quality assurance
on:
  push:
    branches: [ main ]
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/qa.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

jobs:
  test:
    name: Scoring and browser integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for file in assets/*.js; do node --check "$file"; done
      - name: Run all clinical scoring regression tests
        run: node --test tests/*.test.cjs
      - name: Verify all HTML assets exist
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const files=[...html.matchAll(/(?:src|href)="(assets\/[^"?]+)(?:\?[^"]*)?"/g)].map(m=>m[1]);
          for (const name of files) {
            if(!fs.existsSync(name)) throw new Error('Missing linked asset: '+name);
            console.log('OK',name);
          }
          if (!html.includes('v1.1 · Kun demonstrasjon')) throw new Error('Expected version marker v1.1 · Kun demonstrasjon');
          JS

      - name: Browser smoke test (Chrome)
        run: python3 tests/browser-smoke.py

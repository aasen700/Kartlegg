name = "kartlegg-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Nettsidene som får bruke tjenesten.
ALLOWED_ORIGINS = "https://kartlegg.com,https://www.kartlegg.com,http://localhost:8771"
# Disse kontoene slipper inn uten betakode (kommaseparert). Alle andre trenger betakoden (hemmelighet BETA_CODE).
ALLOWED_UIDS = "cV1baiJ2NfcNqakuUvhaJndAq842"
# Største antall meldinger per bruker per døgn.
DAILY_LIMIT = "80"
# Modellene. Samtalene i casen (pasienten, AMK, Hege og de andre) og tilbakemeldingen etter casen.
# Endre her og kjør «npx wrangler deploy». Ingen automatisk reserve-modell.
CHAT_MODEL = "claude-haiku-5-5"
CHAT_EFFORT = "low"
DEBRIEF_MODEL = "claude-sonnet-5-5"
DEBRIEF_EFFORT = "medium"

# Teller for grensen per bruker (Workers KV), opprettet 27.10.2026. Id-en er ikke hemmelig.
# Uten den nekter tjenesten å svare (unntatt lokalt).
[[kv_namespaces]]
binding = "LIMITS"
id = "58a5c30a56c44e348b18dbef7bb6bdf9"

# ANTHROPIC_API_KEY legges inn som hemmelighet, aldri her:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Betakoden legges inn som hemmelighet:
#   npx wrangler secret put BETA_CODE
